openapi: 3.1.0
info:
  title: visibility
  description: API documentation for visibility
  version: 1.0.0
paths:
  /v1/messages:
    get:
      tags:
        - visibility.VisibilityService
      summary: ListMessages
      operationId: visibility.VisibilityService.ListMessages
      parameters:
        - name: publicFilter
          in: query
          schema:
            type: string
            title: public_filter
        - name: internalFilter
          in: query
          schema:
            type: string
            title: internal_filter
        - name: previewFilter
          in: query
          schema:
            type: string
            title: preview_filter
        - name: nested.publicNested
          in: query
          schema:
            type: string
            title: public_nested
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/visibility.Message'
  /v1/messages/{messageId}:
    get:
      tags:
        - visibility.VisibilityService
      summary: GetMessage
      operationId: visibility.VisibilityService.GetMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            title: message_id
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/visibility.Message'
  /v1/multi:
    get:
      tags:
        - visibility.MultiRestrictionService
      summary: GetStatus
      operationId: visibility.MultiRestrictionService.GetStatus
      parameters:
        - name: messageId
          in: query
          schema:
            type: string
            title: message_id
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/visibility.Message'
components:
  schemas:
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: A URL/resource name that uniquely identifies the type of the serialized message.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of google.rpc.Code.
        message:
          type: string
          description: A developer-facing error message.
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          description: A list of messages that carry the error details.
      description: The Status type defines a logical error model suitable for gRPC and REST APIs.
    visibility.GetMessageRequest:
      type: object
      properties:
        messageId:
          type: string
          title: message_id
      title: GetMessageRequest
      additionalProperties: false
    visibility.ListMessagesRequest:
      type: object
      properties:
        publicFilter:
          type: string
          title: public_filter
        internalFilter:
          type: string
          title: internal_filter
        previewFilter:
          type: string
          title: preview_filter
        nested:
          title: nested
          $ref: '#/components/schemas/visibility.NestedFilter'
      title: ListMessagesRequest
      additionalProperties: false
      description: Request whose fields are flattened into query parameters.
    visibility.Message:
      type: object
      properties:
        publicField:
          type: string
          title: public_field
        internalField:
          type: string
          title: internal_field
        previewField:
          type: string
          title: preview_field
        anotherPublicField:
          type: string
          title: another_public_field
        multiRestrictedField:
          type: string
          title: multi_restricted_field
          description: 'Field with comma-separated multi-restriction: visible to INTERNAL or EXTERNAL.'
      title: Message
      additionalProperties: false
    visibility.NestedFilter:
      type: object
      properties:
        publicNested:
          type: string
          title: public_nested
      title: NestedFilter
      additionalProperties: false
security: []
tags:
  - name: visibility.VisibilityService
  - name: visibility.MultiRestrictionService
    description: 'Service with a comma-separated multi-restriction: visible to INTERNAL or PREVIEW.'
