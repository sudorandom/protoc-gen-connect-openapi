openapi: 3.1.0
info:
  title: path_params
  description: API documentation for path_params
  version: 1.0.0
paths:
  /accounts/{accountId}:
    patch:
      tags:
        - path_params.PathParams
      summary: UpdateWithOneof
      description: |-
        Snake-case path param plus a oneOf body. JSON names must strip
         accountId from the request body.
      operationId: path_params.PathParams.UpdateWithOneof
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - type: object
                  properties:
                    profile:
                      allOf:
                        - $ref: '#/components/schemas/path_params.Profile'
                      title: profile
                  title: profile
                - type: object
                  properties:
                    settings:
                      allOf:
                        - $ref: '#/components/schemas/path_params.Settings'
                      title: settings
                  title: settings
              unevaluatedProperties: false
              not:
                allOf:
                  - anyOf:
                      - required:
                          - profile
                      - required:
                          - settings
                  - not:
                      oneOf:
                        - required:
                            - profile
                        - required:
                            - settings
              title: UpdateWithOneofRequest
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /go/{snakeCase}:
    post:
      tags:
        - path_params.PathParams
      summary: Go
      operationId: path_params.PathParams.Go
      parameters:
        - name: snakeCase
          in: path
          description: The snakeCase path parameter.
          required: true
          schema:
            type: string
            title: snake_case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                somethingElse:
                  type: string
                  title: something_else
              title: Request
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /quote:
    get:
      tags:
        - path_params.PathParams
      summary: Quote
      operationId: path_params.PathParams.Quote
      parameters:
        - name: revenue.value
          in: query
          description: The revenue.value query parameter.
          schema:
            type: string
            title: value
        - name: cost.value
          in: query
          description: The cost.value query parameter.
          schema:
            type: string
            title: value
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /resources/{id}:
    patch:
      tags:
        - path_params.PathParams
      summary: Update
      description: Update has a path param and a oneOf in the request body.
      operationId: path_params.PathParams.Update
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - type: object
                  properties:
                    profile:
                      allOf:
                        - $ref: '#/components/schemas/path_params.Profile'
                      title: profile
                  title: profile
                - type: object
                  properties:
                    settings:
                      allOf:
                        - $ref: '#/components/schemas/path_params.Settings'
                      title: settings
                  title: settings
              unevaluatedProperties: false
              not:
                allOf:
                  - anyOf:
                      - required:
                          - profile
                      - required:
                          - settings
                  - not:
                      oneOf:
                        - required:
                            - profile
                        - required:
                            - settings
              properties:
                name:
                  type: string
                  title: name
              title: UpdateRequest
              description: |-
                UpdateRequest has a path param, regular fields, and a oneOf.
                 This tests that the requestBody is generated correctly when
                 MessageToSchema wraps properties+oneOf under AllOf.
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /tree:
    get:
      tags:
        - path_params.PathParams
      summary: Tree
      operationId: path_params.PathParams.Tree
      parameters:
        - name: left.name
          in: query
          description: The left.name query parameter.
          schema:
            type: string
            title: name
        - name: right.name
          in: query
          description: The right.name query parameter.
          schema:
            type: string
            title: name
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /v1/shelves/{shelf}/books:
    get:
      tags:
        - path_params.BookService
      summary: ListBooks
      operationId: path_params.BookService.ListBooks
      parameters:
        - name: shelf
          in: path
          description: the shelf description
          required: true
          schema:
            type: string
            title: shelf
        - name: author
          in: query
          description: the author description
          schema:
            type: string
            title: author
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/book.ListBooksResponse'
components:
  schemas:
    book.ListBooksRequest:
      type: object
      properties:
        shelf:
          type: string
          title: shelf
          description: the shelf description
        author:
          type: string
          title: author
          description: the author description
      title: ListBooksRequest
      additionalProperties: false
    book.ListBooksResponse:
      type: object
      title: ListBooksResponse
      additionalProperties: false
    google.protobuf.Empty:
      type: object
      description: An empty JSON object.
    path_params.Money:
      type: object
      properties:
        value:
          type: string
          title: value
      title: Money
      additionalProperties: false
    path_params.Node:
      type: object
      properties:
        name:
          type: string
          title: name
        child:
          allOf:
            - $ref: '#/components/schemas/path_params.Node'
          title: child
      title: Node
      additionalProperties: false
      description: |-
        Node refers to itself. Flattening stops when a type reappears on the branch
         being expanded, so a self-referential type terminates.
    path_params.Profile:
      type: object
      properties:
        displayName:
          type: string
          title: display_name
      title: Profile
      additionalProperties: false
    path_params.QuoteRequest:
      type: object
      properties:
        revenue:
          allOf:
            - $ref: '#/components/schemas/path_params.Money'
          title: revenue
        cost:
          allOf:
            - $ref: '#/components/schemas/path_params.Money'
          title: cost
      title: QuoteRequest
      additionalProperties: false
      description: |-
        QuoteRequest holds two fields of the same message type. Each one is its own
         query parameter; sharing a type must not collapse them into one.
    path_params.Request:
      type: object
      properties:
        snakeCase:
          type: string
          title: snake_case
        somethingElse:
          type: string
          title: something_else
      title: Request
      required:
        - snakeCase
      additionalProperties: false
    path_params.Settings:
      type: object
      properties:
        theme:
          type: string
          title: theme
      title: Settings
      additionalProperties: false
    path_params.TreeRequest:
      type: object
      properties:
        left:
          allOf:
            - $ref: '#/components/schemas/path_params.Node'
          title: left
        right:
          allOf:
            - $ref: '#/components/schemas/path_params.Node'
          title: right
      title: TreeRequest
      additionalProperties: false
    path_params.UpdateRequest:
      type: object
      anyOf:
        - type: object
          properties:
            profile:
              allOf:
                - $ref: '#/components/schemas/path_params.Profile'
              title: profile
          title: profile
        - type: object
          properties:
            settings:
              allOf:
                - $ref: '#/components/schemas/path_params.Settings'
              title: settings
          title: settings
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - profile
              - required:
                  - settings
          - not:
              oneOf:
                - required:
                    - profile
                - required:
                    - settings
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
      title: UpdateRequest
      required:
        - id
      description: |-
        UpdateRequest has a path param, regular fields, and a oneOf.
         This tests that the requestBody is generated correctly when
         MessageToSchema wraps properties+oneOf under AllOf.
    path_params.UpdateWithOneofRequest:
      type: object
      anyOf:
        - type: object
          properties:
            profile:
              allOf:
                - $ref: '#/components/schemas/path_params.Profile'
              title: profile
          title: profile
        - type: object
          properties:
            settings:
              allOf:
                - $ref: '#/components/schemas/path_params.Settings'
              title: settings
          title: settings
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - profile
              - required:
                  - settings
          - not:
              oneOf:
                - required:
                    - profile
                - required:
                    - settings
      properties:
        accountId:
          type: string
          title: account_id
      title: UpdateWithOneofRequest
security: []
tags:
  - name: path_params.PathParams
  - name: path_params.BookService
