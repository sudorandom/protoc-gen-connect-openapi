openapi: 3.1.0
info:
  title: path_params
  description: API documentation for path_params
  version: 1.0.0
paths:
  /accounts/{accountId}:
    patch:
      tags:
        - path_params.PathParams
      summary: UpdateWithOneof
      description: |-
        Snake-case path param plus a oneOf body. JSON names must strip
         accountId from the request body.
      operationId: path_params.PathParams.UpdateWithOneof
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            title: account_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              not:
                required:
                  - profile
                  - settings
              properties:
                profile:
                  title: profile
                  $ref: '#/components/schemas/path_params.Profile'
                settings:
                  title: settings
                  $ref: '#/components/schemas/path_params.Settings'
              title: UpdateWithOneofRequest
              additionalProperties: false
        required: true
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /go/{snakeCase}:
    post:
      tags:
        - path_params.PathParams
      summary: Go
      operationId: path_params.PathParams.Go
      parameters:
        - name: snakeCase
          in: path
          required: true
          schema:
            type: string
            title: snake_case
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                somethingElse:
                  type: string
                  title: something_else
              title: Request
              additionalProperties: false
        required: true
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /quote:
    get:
      tags:
        - path_params.PathParams
      summary: Quote
      operationId: path_params.PathParams.Quote
      parameters:
        - name: revenue.value
          in: query
          schema:
            type: string
            title: value
        - name: cost.value
          in: query
          schema:
            type: string
            title: value
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /resources/{id}:
    patch:
      tags:
        - path_params.PathParams
      summary: Update
      description: Update has a path param and a oneOf in the request body.
      operationId: path_params.PathParams.Update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            title: id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              not:
                required:
                  - profile
                  - settings
              properties:
                name:
                  type: string
                  title: name
                profile:
                  title: profile
                  $ref: '#/components/schemas/path_params.Profile'
                settings:
                  title: settings
                  $ref: '#/components/schemas/path_params.Settings'
              title: UpdateRequest
              additionalProperties: false
              description: |-
                UpdateRequest has a path param, regular fields, and a oneOf.
                 This tests that the requestBody is generated correctly when
                 MessageToSchema wraps properties+oneOf under AllOf.
        required: true
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /tree:
    get:
      tags:
        - path_params.PathParams
      summary: Tree
      operationId: path_params.PathParams.Tree
      parameters:
        - name: left.name
          in: query
          schema:
            type: string
            title: name
        - name: right.name
          in: query
          schema:
            type: string
            title: name
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /v1/shelves/{shelf}/books:
    get:
      tags:
        - path_params.BookService
      summary: ListBooks
      operationId: path_params.BookService.ListBooks
      parameters:
        - name: shelf
          in: path
          description: the shelf description
          required: true
          schema:
            type: string
            title: shelf
        - name: author
          in: query
          description: the author description
          schema:
            type: string
            title: author
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/book.ListBooksResponse'
components:
  schemas:
    book.ListBooksRequest:
      type: object
      properties:
        shelf:
          type: string
          title: shelf
          description: the shelf description
        author:
          type: string
          title: author
          description: the author description
      title: ListBooksRequest
      additionalProperties: false
    book.ListBooksResponse:
      type: object
      title: ListBooksResponse
      additionalProperties: false
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: A URL/resource name that uniquely identifies the type of the serialized message.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    google.protobuf.Empty:
      type: object
      description: An empty JSON object.
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of google.rpc.Code.
        message:
          type: string
          description: A developer-facing error message.
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          description: A list of messages that carry the error details.
      description: The Status type defines a logical error model suitable for gRPC and REST APIs.
    path_params.Money:
      type: object
      properties:
        value:
          type: string
          title: value
      title: Money
      additionalProperties: false
    path_params.Node:
      type: object
      properties:
        name:
          type: string
          title: name
        child:
          title: child
          $ref: '#/components/schemas/path_params.Node'
      title: Node
      additionalProperties: false
      description: |-
        Node refers to itself. Flattening stops when a type reappears on the branch
         being expanded, so a self-referential type terminates.
    path_params.Profile:
      type: object
      properties:
        displayName:
          type: string
          title: display_name
      title: Profile
      additionalProperties: false
    path_params.QuoteRequest:
      type: object
      properties:
        revenue:
          title: revenue
          $ref: '#/components/schemas/path_params.Money'
        cost:
          title: cost
          $ref: '#/components/schemas/path_params.Money'
      title: QuoteRequest
      additionalProperties: false
      description: |-
        QuoteRequest holds two fields of the same message type. Each one is its own
         query parameter; sharing a type must not collapse them into one.
    path_params.Request:
      type: object
      properties:
        snakeCase:
          type: string
          title: snake_case
        somethingElse:
          type: string
          title: something_else
      title: Request
      required:
        - snakeCase
      additionalProperties: false
    path_params.Settings:
      type: object
      properties:
        theme:
          type: string
          title: theme
      title: Settings
      additionalProperties: false
    path_params.TreeRequest:
      type: object
      properties:
        left:
          title: left
          $ref: '#/components/schemas/path_params.Node'
        right:
          title: right
          $ref: '#/components/schemas/path_params.Node'
      title: TreeRequest
      additionalProperties: false
    path_params.UpdateRequest:
      type: object
      not:
        required:
          - profile
          - settings
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        profile:
          title: profile
          $ref: '#/components/schemas/path_params.Profile'
        settings:
          title: settings
          $ref: '#/components/schemas/path_params.Settings'
      title: UpdateRequest
      required:
        - id
      additionalProperties: false
      description: |-
        UpdateRequest has a path param, regular fields, and a oneOf.
         This tests that the requestBody is generated correctly when
         MessageToSchema wraps properties+oneOf under AllOf.
    path_params.UpdateWithOneofRequest:
      type: object
      not:
        required:
          - profile
          - settings
      properties:
        accountId:
          type: string
          title: account_id
        profile:
          title: profile
          $ref: '#/components/schemas/path_params.Profile'
        settings:
          title: settings
          $ref: '#/components/schemas/path_params.Settings'
      title: UpdateWithOneofRequest
      additionalProperties: false
security: []
tags:
  - name: path_params.PathParams
  - name: path_params.BookService
