syntax = "proto3";
package path_params;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "path_params/book.proto";

message Request {
  string snake_case = 1 [(google.api.field_behavior) = REQUIRED];
  string something_else = 2;
}

message Profile {
  string display_name = 1;
}

message Settings {
  string theme = 1;
}

// UpdateRequest has a path param, regular fields, and a oneOf.
// This tests that the requestBody is generated correctly when
// MessageToSchema wraps properties+oneOf under AllOf.
message UpdateRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2;
  oneof details {
    Profile profile = 3;
    Settings settings = 4;
  }
}

message Money {
  string value = 1;
}

// QuoteRequest holds two fields of the same message type. Each one is its own
// query parameter; sharing a type must not collapse them into one.
message QuoteRequest {
  Money revenue = 1;
  Money cost = 2;
}

// Node refers to itself. Flattening stops when a type reappears on the branch
// being expanded, so a self-referential type terminates.
message Node {
  string name = 1;
  Node child = 2;
}

message TreeRequest {
  Node left = 1;
  Node right = 2;
}

service PathParams {
  rpc Go(Request) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/go/{snake_case}"
      body: "*"
    };
  }

  rpc Tree(TreeRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      get: "/tree"
    };
  }

  rpc Quote(QuoteRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      get: "/quote"
    };
  }

  // Update has a path param and a oneOf in the request body.
  rpc Update(UpdateRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      patch: "/resources/{id}"
      body: "*"
    };
  }
}

service BookService {
  rpc ListBooks(book.ListBooksRequest) returns (book.ListBooksResponse) {
    option (google.api.http) = {
      get: "/v1/shelves/{shelf}/books"
    };
  }
}