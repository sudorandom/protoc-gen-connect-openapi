openapi: 3.1.0
info:
  title: well_known_type_descriptions_concise
  description: API documentation for well_known_type_descriptions_concise
  version: 1.0.0
paths:
  /v1/events:
    get:
      tags:
        - well_known_type_descriptions_concise.WellKnownDescriptionService
      summary: ListEvents
      operationId: well_known_type_descriptions_concise.WellKnownDescriptionService.ListEvents
      parameters:
        - name: startTime
          in: query
          description: Only return events that happened at or after this time.
          schema:
            type: string
            examples:
              - "2023-01-15T01:30:15.01Z"
              - "2024-12-25T12:00:00Z"
            format: date-time
        - name: endTime
          in: query
          description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
          schema:
            type: string
            examples:
              - "2023-01-15T01:30:15.01Z"
              - "2024-12-25T12:00:00Z"
            format: date-time
        - name: timeout
          in: query
          description: How long to wait for events before giving up.
          schema:
            type: string
            format: duration
        - name: label
          in: query
          description: Only return events with this label.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/well_known_type_descriptions_concise.ListEventsResponse'
components:
  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.StringValue:
      type: string
      description: A string value; `null` is also accepted.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    well_known_type_descriptions_concise.Event:
      type: object
      properties:
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: When the event happened.
      title: Event
      additionalProperties: false
    well_known_type_descriptions_concise.ListEventsRequest:
      type: object
      properties:
        startTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: Only return events that happened at or after this time.
        endTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_time
        timeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: timeout
          description: How long to wait for events before giving up.
        label:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.StringValue'
          title: label
          description: Only return events with this label.
      title: ListEventsRequest
      additionalProperties: false
    well_known_type_descriptions_concise.ListEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/well_known_type_descriptions_concise.Event'
          title: events
      title: ListEventsResponse
      additionalProperties: false
security: []
