syntax = "proto3";

package additional_bindings;

import "google/api/annotations.proto";

service Directory {
  // LookupUserInTenant demonstrates the issue with additional_bindings
  // where the same operation ID is used for different paths.
  rpc LookupUserInTenant(UserLookup) returns (User) {
    option (google.api.http) = {
      get: "/svc/directory/{tenant}/user/{uuid}"

      additional_bindings: {
        get: "/svc/directory/{tenant}/user"
      }
      additional_bindings: {
        get: "/svc/directory/{tenant}/user/foo"
      }
    };
  }

  // Search binds two methods to a single path. Each is a separate operation on
  // the same path item, so neither may replace the other.
  rpc Search(UserQuery) returns (User) {
    option (google.api.http) = {
      post: "/svc/directory/search"
      body: "*"

      additional_bindings: {
        get: "/svc/directory/search"
      }
    };
  }
}

message UserQuery {
  string query = 1;
}

message UserLookup {
  string tenant = 1;
  string uuid = 2;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}