openapi: 3.1.0
info:
  title: standard
  description: |-
    ## standard.GnosticRequestBodyQueryParamsService

    A gnostic request_body replaces the generated body, but fields outside the
     path and body still become query parameters, per binding.
  version: 1.0.0
