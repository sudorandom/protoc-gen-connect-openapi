openapi: 3.1.0
info:
  title: standard
  description: |-
    ## standard.GnosticRequestBodyQueryParamsService

    A gnostic request_body replaces the generated body, but fields outside the
     path and body still become query parameters, per binding.
  version: 1.0.0
paths:
  /v1/folders/{folder}/uploads:
    post:
      tags:
        - standard.GnosticRequestBodyQueryParamsService
      summary: Upload
      operationId: standard.GnosticRequestBodyQueryParamsService.Upload2
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
            title: folder
        - name: name
          in: query
          schema:
            type: string
            title: name
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard.UploadResponse'
  /v1/uploads:
    post:
      tags:
        - standard.GnosticRequestBodyQueryParamsService
      summary: Upload
      operationId: standard.GnosticRequestBodyQueryParamsService.Upload
      parameters:
        - name: folder
          in: query
          schema:
            type: string
            title: folder
        - name: name
          in: query
          schema:
            type: string
            title: name
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard.UploadResponse'
  /v1/uploads:search:
    post:
      tags:
        - standard.GnosticRequestBodyQueryParamsService
      summary: Search
      description: |-
        Without a body field, the gnostic request_body describes the whole
         request, so no fields become query parameters.
      operationId: standard.GnosticRequestBodyQueryParamsService.Search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/standard.SearchRequest'
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard.SearchResponse'
components:
  schemas:
    google.api.HttpBody:
      type: object
      properties:
        contentType:
          type: string
          title: content_type
          description: The HTTP Content-Type header value specifying the content type of the body.
        data:
          type: string
          title: data
          format: byte
          description: The HTTP request/response body as raw binary.
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          title: extensions
          description: |-
            Application specific response metadata. Must be set in the first response
             for streaming APIs.
      title: HttpBody
      additionalProperties: false
      description: |-
        Message that represents an arbitrary HTTP body. It should only be used for
         payload formats that can't be represented as JSON, such as raw binary or
         an HTML page.


         This message can be used both in streaming and non-streaming API methods in
         the request as well as the response.

         It can be used as a top-level request field, which is convenient if one
         wants to extract parameters from either the URL or HTTP template into the
         request fields and also want access to the raw HTTP body.

         Example:

             message GetResourceRequest {
               // A unique request id.
               string request_id = 1;

               // The raw HTTP body is bound to this field.
               google.api.HttpBody http_body = 2;

             }

             service ResourceService {
               rpc GetResource(GetResourceRequest)
                 returns (google.api.HttpBody);
               rpc UpdateResource(google.api.HttpBody)
                 returns (google.protobuf.Empty);

             }

         Example with streaming methods:

             service CaldavService {
               rpc GetCalendar(stream google.api.HttpBody)
                 returns (stream google.api.HttpBody);
               rpc UpdateCalendar(stream google.api.HttpBody)
                 returns (stream google.api.HttpBody);

             }

         Use of this type only changes how the request and response bodies are
         handled, all other features will continue to work unchanged.
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: A URL identifying the type of the embedded message, e.g. `type.googleapis.com/google.rpc.ErrorInfo`.
      required:
        - '@type'
      additionalProperties: true
      description: An arbitrary message with a type URL identifying the encoded message type.
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of google.rpc.Code.
        message:
          type: string
          description: A developer-facing error message.
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          description: A list of messages that carry the error details.
      description: The Status type defines a logical error model suitable for gRPC and REST APIs.
    standard.SearchRequest:
      type: object
      properties:
        filter:
          type: string
          title: filter
        pageSize:
          type: integer
          title: page_size
          format: int32
        content:
          title: content
          $ref: '#/components/schemas/google.api.HttpBody'
      title: SearchRequest
      additionalProperties: false
    standard.SearchResponse:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          title: ids
      title: SearchResponse
      additionalProperties: false
    standard.UploadRequest:
      type: object
      properties:
        folder:
          type: string
          title: folder
        content:
          title: content
          $ref: '#/components/schemas/google.api.HttpBody'
        name:
          type: string
          title: name
      title: UploadRequest
      additionalProperties: false
    standard.UploadResponse:
      type: object
      properties:
        id:
          type: string
          title: id
      title: UploadResponse
      additionalProperties: false
security: []
tags:
  - name: standard.GnosticRequestBodyQueryParamsService
    description: |-
      A gnostic request_body replaces the generated body, but fields outside the
       path and body still become query parameters, per binding.
