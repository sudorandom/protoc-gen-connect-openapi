      summary: Upload
      operationId: standard.GnosticRequestBodyQueryParamsService.Upload2
      parameters:
        - name: folder
          in: path
          description: The folder path parameter.
          required: true
          schema:
            type: string
            title: folder
        - name: name
          in: query
          description: The name query parameter.
          schema:
            type: string
            title: name
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/standard.UploadResponse'
  /v1/uploads:
