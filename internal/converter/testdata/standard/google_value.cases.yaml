cases:
  - name: "healthcheck with string"
    path: "samples.Test/HealthCheck"
    body: '"kevin"'
    headers:
      Content-Type: application/json
      Connect-Protocol-Version: 1

  - name: "healthcheck with object"
    path: "samples.Test/HealthCheck"
    body: '{"value": "kevin"}'
    headers:
      Content-Type: application/json
      Connect-Protocol-Version: 1
    errors:
      - ".*Reason: got object, want string, Location: /type.*"

  - name: "with struct"
    path: "samples.Test/WithGoogleValueMessage"
    body: '{"someStruct": {"name": "kevin"}}'
    headers:
      Content-Type: application/json
      Connect-Protocol-Version: 1

  - name: "with struct"
    path: "samples.Test/WithGoogleValueMessage"
    body: '{"someStruct": {"name": "kevin", "age": 36, "human": false, "friends_ids": [1, 2, 3, 4]}}'
    headers:
      Content-Type: application/json
      Connect-Protocol-Version: 1

  # ProtoJSON encodes google.protobuf.ListValue as a bare JSON array.
  - name: "with list value"
    path: "samples.Test/WithGoogleValueMessage"
    body: '{"someList": ["kevin", 36, false, null, ["nested"], {"key": "value"}]}'
    headers:
      Content-Type: application/json
      Connect-Protocol-Version: 1

  - name: "with list value wrapped in values object"
    path: "samples.Test/WithGoogleValueMessage"
    body: '{"someList": {"values": ["kevin"]}}'
    headers:
      Content-Type: application/json
      Connect-Protocol-Version: 1
    errors:
      - ".*Reason: got object, want array, Location: /properties/someList/type.*"

  # ListValue in a GET request is a single array-typed query parameter, not a flattened `values` wrapper.
  - name: "list-value query param"
    method: GET
    path: "/list-value"
    query: "items=kevin&items=36"
