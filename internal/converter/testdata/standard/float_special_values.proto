syntax = "proto3";

package test.special.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";

message FloatValues {
  float float_value = 1;
  double double_value = 2;
  optional float optional_float = 3;
  optional double optional_double = 4;
  repeated float floats = 5;
  repeated double doubles = 6;
  map<string, float> float_map = 7;
  map<string, double> double_map = 8;
  oneof choice {
    float float_choice = 9;
    double double_choice = 10;
  }
}

message ConstrainedFloatValues {
  float float_const = 1 [(buf.validate.field).float.const = 1];
  double double_const = 2 [(buf.validate.field).double.const = 1];
  double double_range = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  float float_finite = 4 [(buf.validate.field).float.finite = true];
  double double_finite = 5 [(buf.validate.field).double.finite = true];
  optional double optional_finite = 6 [(buf.validate.field).double.finite = true];
  repeated float floats = 7 [(buf.validate.field).repeated.items.float.finite = true];
  map<string, double> doubles = 8 [(buf.validate.field).map.values.double.finite = true];
  double annotated_range = 9 [(gnostic.openapi.v3.property) = {
    minimum: 0
    maximum: 1
  }];
  double annotated_string = 10 [(gnostic.openapi.v3.property) = {type: "string"}];
  double annotated_nullable = 11 [(gnostic.openapi.v3.property) = {nullable: true}];
}
