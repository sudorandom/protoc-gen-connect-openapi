cases:
  - name: "plain-oneof-no-member"
    path: "/compliance"
    body: '{"reference": "case-1"}'
    headers:
      Content-Type: application/json

  - name: "plain-oneof-one-member"
    path: "/compliance"
    body: '{"reference": "case-1", "kyc": "person"}'
    headers:
      Content-Type: application/json

  - name: "plain-oneof-two-members"
    path: "/compliance"
    body: '{"kyc": "person", "kyb": "business"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "plain-oneof-additional-property"
    path: "/compliance"
    body: '{"kyc": "person", "undeclared": true}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "required-oneof-no-member"
    path: "/required-compliance"
    body: '{"reference": "case-2"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "required-oneof-one-member"
    path: "/required-compliance"
    body: '{"reference": "case-2", "kyb": "business"}'
    headers:
      Content-Type: application/json

  - name: "required-oneof-two-members"
    path: "/required-compliance"
    body: '{"kyc": "person", "kyb": "business"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "required-oneof-additional-property"
    path: "/required-compliance"
    body: '{"kyb": "business", "undeclared": true}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "two-oneofs-no-members"
    path: "/screening"
    body: '{"reference": "case-3"}'
    headers:
      Content-Type: application/json

  - name: "two-oneofs-one-member-each"
    path: "/screening"
    body: '{"reference": "case-3", "kyc": "person", "region": "eu"}'
    headers:
      Content-Type: application/json

  - name: "two-oneofs-two-members-of-subject"
    path: "/screening"
    body: '{"kyc": "person", "kyb": "business", "region": "eu"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "two-oneofs-two-members-of-scope"
    path: "/screening"
    body: '{"kyc": "person", "region": "eu", "global": true}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "two-oneofs-additional-property"
    path: "/screening"
    body: '{"kyc": "person", "region": "eu", "undeclared": true}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "contact-no-member"
    path: "/contact"
    body: '{}'
    headers:
      Content-Type: application/json

  - name: "contact-one-member"
    path: "/contact"
    body: '{"email": "x"}'
    headers:
      Content-Type: application/json

  - name: "contact-two-members"
    path: "/contact"
    body: '{"phone": "x", "post": "y"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "contact-three-members"
    path: "/contact"
    body: '{"email": "x", "phone": "y", "phone": "z"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "delivery-no-member"
    path: "/delivery"
    body: '{}'
    headers:
      Content-Type: application/json

  - name: "delivery-one-member"
    path: "/delivery"
    body: '{"courier": "x"}'
    headers:
      Content-Type: application/json

  - name: "delivery-two-members"
    path: "/delivery"
    body: '{"mail": "x", "locker": "y"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"

  - name: "delivery-three-members"
    path: "/delivery"
    body: '{"courier": "x", "mail": "y", "pickup": "z"}'
    headers:
      Content-Type: application/json
    errors:
      - ".*"
