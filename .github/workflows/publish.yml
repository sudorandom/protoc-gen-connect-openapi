name: goreleaser

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Setup Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-publish-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-publish-
            ${{ runner.os }}-go-

      # A tag can point at any commit, so don't publish without the same
      # checks the main branch gets.
      - name: Test
        run: just test

      - name: Lint
        run: just lint

      - name: Run GoReleaser
        run: just release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
