name: goreleaser

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Setup Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-publish-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-publish-
            ${{ runner.os }}-go-

      # A tag can point at any commit, so don't publish without the same
      # checks the main branch gets.
      - name: Test
        run: just test

      - name: Lint
        run: just lint

      - name: Run GoReleaser
        run: just release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
