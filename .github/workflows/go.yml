name: Go

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26', '1.27' ]

    steps:
      - uses: actions/checkout@v5

      - name: Configure Go version for matrix
        run: printf "[tools]\ngo = \"%s\"\n" "${{ matrix.go-version }}" > mise.local.toml

      - name: Setup Tools
        uses: jdx/mise-action@v4

      - name: Setup Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Build
        run: just build

      - name: Test
        run: just test

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Tools
        uses: jdx/mise-action@v4
      - name: Setup Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-
            ${{ runner.os }}-go-
      - name: Run linter
        run: just lint

  vacuum:
    name: vacuum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Tools
        uses: jdx/mise-action@v4
      - name: Setup Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-vacuum-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-vacuum-
            ${{ runner.os }}-go-
      - name: Run vacuum on golden specs
        run: just vacuum
